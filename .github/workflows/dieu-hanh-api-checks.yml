name: Dieu hanh API checks
on:
  push:
    branches: [feature/dieu-hanh-readonly]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Unit tests
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npx tsc --noEmit
