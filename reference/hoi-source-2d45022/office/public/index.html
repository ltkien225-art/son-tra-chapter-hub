<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#793c83"><title>Sổ tay Hội Phụ nữ Sơn Trà</title><style>body{margin:0;background:#f8f3fa;color:#382840;font:16px system-ui,-apple-system,sans-serif}header{background:linear-gradient(125deg,#753c87,#bd76a6);color:white;padding:26px 20px}main{max-width:940px;margin:auto;padding:18px}h1{font-size:25px}h2{font-size:19px}section{background:white;border:1px solid #e8d8ea;border-radius:16px;padding:18px;margin:16px 0}input,select,textarea,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #d9c6df;border-radius:10px;font:inherit;margin:7px 0}button{background:#793c83;color:white;font-weight:600;cursor:pointer}button.secondary{background:#fff;color:#793c83}label{font-weight:600}small{color:#66596c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.item{border-top:1px solid #eee;padding:12px 0}.muted{color:#6d6072}.hide{display:none}.error{color:#a51f45}.ok{color:#27643c}</style></head><body><header><h1>🌸 Hội LHPN phường Sơn Trà</h1><div>Bộ công cụ Văn phòng · Sổ Chi hội Phụ nữ</div></header><main><section><h2>Thông tin truy cập</h2><div id="identity">Đang xác thực...</div><div id="notice" role="status"></div></section><div id="app" class="hide"><section><h2>Chi hội phụ trách</h2><select id="chapter"></select><div id="chapterInfo" class="muted"></div></section><div class="grid"><section><h2>Gửi nội dung</h2><form id="submission"><label>Loại nội dung</label><select id="kind"><option value="report">Báo cáo</option><option value="activity">Hoạt động Hội</option><option value="situation">Nắm tình hình hội viên</option><option value="feedback">Kiến nghị, phản ánh</option></select><label>Tiêu đề</label><input id="subject" maxlength="180" required><label>Nội dung</label><textarea id="body" rows="5" maxlength="5000" required></textarea><button type="submit">Gửi về Văn phòng</button></form></section><section><h2>Thống kê hội viên theo tháng</h2><form id="counts"><label>Kỳ thống kê</label><input id="period" type="month" required><label>Tổng số hội viên</label><input id="total" type="number" min="0" required><label>Kết nạp mới</label><input id="new" type="number" min="0" required><label>Giảm trong kỳ</label><input id="left" type="number" min="0" required><button type="submit">Lưu thống kê</button></form><div id="history"></div></section></div><section><h2>Nội dung đã gửi</h2><button class="secondary" id="refresh">Làm mới danh sách</button><div id="records"></div></section></div></main><script type="module" src="/app.js"></script></body></html>
